spring.application.name=cidadeemdia

# MySQL (o banco é criado automaticamente se não existir)
spring.datasource.url=jdbc:mysql://localhost:3306/cidadeemdia?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
