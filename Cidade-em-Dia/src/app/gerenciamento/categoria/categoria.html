<div class="cabecalho">
  <h1>Categorias</h1>
  <button mat-flat-button type="button" (click)="novaCategoria()">+ Nova categoria</button>
</div>

<table mat-table [dataSource]="categorias()" class="tabela">
  <ng-container matColumnDef="nome">
    <th mat-header-cell *matHeaderCellDef>Categoria</th>
    <td mat-cell *matCellDef="let categoria">{{ categoria.nome }}</td>
  </ng-container>

  <ng-container matColumnDef="situacao">
    <th mat-header-cell *matHeaderCellDef>Situação</th>
    <td mat-cell *matCellDef="let categoria">{{ categoria.ativa ? 'Ativa' : 'Inativa' }}</td>
  </ng-container>

  <ng-container matColumnDef="acoes">
    <th mat-header-cell *matHeaderCellDef>Ações</th>
    <td mat-cell *matCellDef="let categoria">
      <button mat-stroked-button type="button" (click)="editarCategoria(categoria)">Editar</button>
      <button mat-stroked-button type="button" (click)="alternarSituacao(categoria)">
        {{ categoria.ativa ? 'Desativar' : 'Ativar' }}
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="colunasExibidas"></tr>
  <tr mat-row *matRowDef="let linha; columns: colunasExibidas"></tr>
</table>
