
<div class="layout">

  <app-menu-lateral></app-menu-lateral>

  <main class="conteudo">

    <div class="pagina-usuarios">

      <h1>Usuários</h1>

      <table mat-table [dataSource]="usuarios" class="tabela-usuarios">

        <!-- Coluna Nome -->
        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef>
            Nome
          </th>
          <td mat-cell *matCellDef="let usuario">
            {{ usuario.nome }}
          </td>
        </ng-container>

        <!-- Coluna E-mail -->
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>
            E-mail
          </th>
          <td mat-cell *matCellDef="let usuario">
            {{ usuario.email }}
          </td>
        </ng-container>

        <!-- Coluna Perfil -->
        <ng-container matColumnDef="perfil">
          <th mat-header-cell *matHeaderCellDef>
            Perfil
          </th>
          <td mat-cell *matCellDef="let usuario">
            {{ usuario.perfil }}
          </td>
        </ng-container>

        <!-- Coluna Situação -->
        <ng-container matColumnDef="situacao">
          <th mat-header-cell *matHeaderCellDef>
            Situação
          </th>
          <td mat-cell *matCellDef="let usuario">
            {{ usuario.ativo ? 'Ativo' : 'Inativo' }}
          </td>
        </ng-container>

        <!-- Coluna Ação -->
        <ng-container matColumnDef="acao">
          <th mat-header-cell *matHeaderCellDef>
            Ação
          </th>
          <td mat-cell *matCellDef="let usuario">
            <button
              mat-button
              (click)="alternarSituacao(usuario)">
              {{ usuario.ativo ? 'Desativar' : 'Ativar' }}
            </button>
          </td>
        </ng-container>

        <!-- Cabeçalho da tabela -->
        <tr
          mat-header-row
          *matHeaderRowDef="colunasExibidas">
        </tr>

        <!-- Linhas dos usuários -->
        <tr
          mat-row
          *matRowDef="let linha; columns: colunasExibidas">
        </tr>

      </table>

    </div>

  </main>

</div>
